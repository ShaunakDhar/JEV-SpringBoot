server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: "off"
  web:
    resources:
      add-mappings: false
  application:
    name: jev-learning-lab
  jackson:
    default-property-inclusion: non_null
jev:
  api-key: ${TYPESAFE_API_KEY:}
  base-url: ${TYPESAFE_BASE_URL:https://api.typesafe.ai}
  model: ${JEV_MODEL:jev-1.14.0}
  images-enabled: ${JEV_IMAGES_ENABLED:false}
  long-context-enabled: ${JEV_LONG_CONTEXT_ENABLED:false}
